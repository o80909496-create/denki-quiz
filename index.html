let currentIdx = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;
    const q = quizData[currentIdx];
    document.getElementById("progress").innerText = `問題 ${currentIdx + 1} / ${quizData.length}`;
    document.getElementById("question").innerText = `[問${currentIdx + 1}]\n${q.q}`;
    
    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";
    
    q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = `${index + 1}. ${opt}`;
        btn.onclick = () => checkAnswer(index);
        optionsContainer.appendChild(btn);
    });

    document.getElementById("explanation").style.display = "none";
    document.getElementById("next-btn").style.display = "none";
}

function checkAnswer(selectedIndex) {
    if (answered) return;
    answered = true;

    const q = quizData[currentIdx];
    const buttons = document.querySelectorAll(".option-btn");

    if (selectedIndex === q.answer) {
        buttons[selectedIndex].classList.add("correct");
        score++;
    } else {
        buttons[selectedIndex].classList.add("wrong");
        buttons[q.answer].classList.add("correct");
    }

    document.getElementById("explanation-text").innerText = q.exp;
    document.getElementById("explanation").style.display = "block";
    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentIdx++;
    if (currentIdx < quizData.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("result-score").innerText = `${score} / ${quizData.length} 点`;
}

function restartQuiz() {
    currentIdx = 0;
    score = 0;
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    loadQuestion();
}

// アプリ起動
loadQuestion();
